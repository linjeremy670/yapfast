name: Sync Upstream & Build Windows

on:
  schedule:
    # Checks upstream every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with yapfast/yapfast main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/yapfast/yapfast.git
          git fetch upstream main

          git checkout main
          git rebase upstream/main
          git push origin main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM/Clang (for WebRTC & Skia bindings)
        run: choco install llvm -y

      - name: Expose LIBCLANG_PATH
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build Windows release binary
        run: cargo build --release --locked

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/yapfast.exe dist/yapfast.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: yapfast-windows-x64
          path: dist/yapfast.exe
          retention-days: 14
