name: Sync Upstream & Build Windows

on:
  workflow_call:
    inputs:
      force_build:
        type: boolean
        default: false
    secrets:
      YAPFAST_TOKEN:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if the current commit was already released
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yapfast-sync-windows
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    env:
      GH_REPO: linjeremy670/yapfast
      YAPFAST_REPOSITORY: linjeremy670/yapfast
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          repository: linjeremy670/yapfast
          ref: automation/windows-build
          token: ${{ secrets.YAPFAST_TOKEN }}
          fetch-depth: 0

      - name: Fast-forward fork main to exact upstream commit
        shell: pwsh
        env:
          YAPFAST_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$env:YAPFAST_TOKEN@github.com/$env:YAPFAST_REPOSITORY.git"
          git remote add upstream https://github.com/yapfast/yapfast.git
          git fetch upstream main
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed' }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch fork main' }
            $upstreamSha = (git rev-parse upstream/main).Trim()
            $forkSha = (git rev-parse origin/main).Trim()

            if ($upstreamSha -eq $forkSha) {
              Write-Host "Fork main is already identical to upstream: $upstreamSha"
              break
            }
            git merge-base --is-ancestor origin/main upstream/main
            if ($LASTEXITCODE -ne 0) {
              throw 'Fork main diverged from upstream; refusing to rewrite history'
            }
            git push origin upstream/main:refs/heads/main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Fast-forwarded fork main $forkSha -> $upstreamSha"
              break
            }
            if ($attempt -eq 3) { throw 'Could not fast-forward fork main after three attempts' }
            Write-Warning "Push raced; retrying ($attempt/3)."
          }

      - name: Check for a successful build of this commit
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          $sha = (git rev-parse upstream/main).Trim()
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read GitHub releases' }

          $matching = @($tags | Where-Object { $_ -match "^windows-$sha-\d+-\d+$" })
          $released = $false
          foreach ($tag in $matching) {
            $asset = gh release view $tag --json assets `
              --jq '[.assets[].name] | index("yapfast-windows-x64.exe") != null'
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $tag" }
            if ($asset.Trim() -eq 'true') {
              $released = $true
              break
            }
          }

          $build = (-not $released) -or ($env:FORCE_BUILD -eq 'true')
          "should_build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Commit: $sha; Released: $released; Build: $build"

  build:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: windows-latest
    env:
      GH_REPO: linjeremy670/yapfast
      YAPFAST_REPOSITORY: linjeremy670/yapfast
      GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
      BUILD_SHA: ${{ needs.sync.outputs.sha }}

    steps:
      - name: Checkout exact synced commit
        uses: actions/checkout@v5
        with:
          repository: linjeremy670/yapfast
          token: ${{ secrets.YAPFAST_TOKEN }}
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Install project-pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }

      - name: Restore Cargo build cache
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          key: windows-latest
          cache-on-failure: true

      - name: Restore cached LLVM 21 installation
        id: llvm_cache
        uses: actions/cache@v5
        with:
          path: C:\Program Files\LLVM
          key: windows-llvm-21.1.7-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install LLVM 21 for Skia symbol isolation
        shell: pwsh
        run: |
          $llvmHome = 'C:\Program Files\LLVM'
          $llvm = Join-Path $llvmHome 'bin'
          $objcopy = Join-Path $llvm 'llvm-objcopy.exe'
          $major = 0
          if (Test-Path $objcopy) {
            $version = (& $objcopy --version | Out-String)
            if ($version -match 'LLVM version (\d+)') { $major = [int]$Matches[1] }
          }
          if ($major -lt 21) {
            choco upgrade llvm --version=21.1.7 -y --no-progress --allow-downgrade
            if ($LASTEXITCODE -ne 0) { throw 'LLVM 21 installation failed' }
          }
          $version = (& $objcopy --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'LLVM version (2[1-9]|[3-9]\d+)') {
            throw "Skia needs LLVM >= 21; found: $version"
          }
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            throw 'libclang.dll was not found'
          }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          "LLVM_HOME=$llvmHome" >> $env:GITHUB_ENV
          $llvm >> $env:GITHUB_PATH

      - name: Ensure NASM is available
        shell: pwsh
        run: |
          if (Get-Command nasm -ErrorAction SilentlyContinue) { exit 0 }
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          foreach ($dir in @('C:\Program Files\NASM', 'C:\Program Files (x86)\NASM')) {
            if (Test-Path (Join-Path $dir 'nasm.exe')) {
              $dir >> $env:GITHUB_PATH
              exit 0
            }
          }
          throw 'NASM was installed but nasm.exe could not be located'

      - name: Restore prepared Windows Skia archive
        id: skia_cache
        uses: actions/cache@v5
        with:
          path: .local/windows/skia/prepared
          key: windows-skia-v2-${{ hashFiles('scripts/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/Cargo.lock', 'nix/skia-windows-builder/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Prepare Skia when not cached
        shell: pwsh
        run: |
          $assignment = (python scripts/prepare-windows-skia.py --print-env)
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine Skia archive URL' }
          if ($assignment -notmatch '^\$env:SKIA_BINARIES_URL = ''([^'']+)''$') {
            throw 'Unexpected Skia environment output'
          }
          $archiveUrl = $Matches[1]
          $archivePath = $archiveUrl.Replace('file://', '')
          if (Test-Path $archivePath) {
            # Check that the restored gzip and all tar members can be read.
            python -c "import sys,tarfile; t=tarfile.open(sys.argv[1], 'r:gz'); [f.read() for m in t if m.isfile() for f in [t.extractfile(m)] if f is not None]; t.close()" $archivePath
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Cached Skia archive is corrupt; rebuilding.'
              Remove-Item $archivePath -Force
            }
          }
          if (-not (Test-Path $archivePath)) {
            python scripts/prepare-windows-skia.py
            if ($LASTEXITCODE -ne 0) { throw 'Skia preparation failed' }
          }
          if (-not (Test-Path $archivePath)) { throw 'Skia archive is missing' }
          "SKIA_BINARIES_URL=$archiveUrl" >> $env:GITHUB_ENV

      - name: Build release binary
        id: cargo_build
        shell: pwsh
        run: |
          $started = [DateTime]::UtcNow
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release compilation failed' }
          $seconds = [int]([DateTime]::UtcNow - $started).TotalSeconds
          "seconds=$seconds" >> $env:GITHUB_OUTPUT
          "### Cargo compilation: $seconds seconds" >> $env:GITHUB_STEP_SUMMARY

      - name: Package executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/yapfast.exe dist/yapfast-windows-x64.exe
          $hash = (Get-FileHash dist/yapfast-windows-x64.exe -Algorithm SHA256).Hash
          "$($hash.ToLowerInvariant())  yapfast-windows-x64.exe" |
            Set-Content dist/SHA256SUMS -Encoding utf8

      - name: Verify packaged executable checksum
        shell: pwsh
        run: |
          $exe = 'dist/yapfast-windows-x64.exe'
          $checksum = 'dist/SHA256SUMS'
          if (-not (Test-Path $exe) -or -not (Test-Path $checksum)) {
            throw 'Executable or checksum file is missing'
          }
          $line = (Get-Content $checksum -Raw).Trim()
          if ($line -notmatch '^([0-9a-f]{64})  yapfast-windows-x64[.]exe$') {
            throw 'SHA256SUMS has an invalid format'
          }
          $expected = $Matches[1]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Packaged executable checksum mismatch' }
          Write-Host "Verified SHA256: $actual"
          "### Verified Windows binary SHA256: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release and commit changelog
        id: publish
        shell: pwsh
        run: |
          git fetch origin --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch release tags' }

          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not find previous releases' }
          $previous = $tags |
            Where-Object { $_ -match '^windows-[0-9a-f]{40}-\d+-\d+$' } |
            Select-Object -First 1

          if ($previous) {
            $changes = @(git log -n 60 --format='- %h %s' "$previous..HEAD")
          } else {
            $changes = @(git log -n 30 --format='- %h %s')
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate changelog' }
          if (-not $changes) { $changes = @('- Rebuilt the same commit.') }

          $notes = @(
            "Windows x64 build for commit $env:BUILD_SHA",
            '', '## Changes since previous successful build', ''
          ) + $changes
          $cargoSeconds = [int]'${{ steps.cargo_build.outputs.seconds }}'
          $referenceSeconds = 1726
          $referenceLabel = 'initial cold build (12 November 2026)'
          if ($previous) {
            $previousBody = (gh release view $previous --json body --jq '.body' | Out-String)
            if ($LASTEXITCODE -eq 0 -and $previousBody -match '(?m)^- Cargo compilation: ([0-9]+) s

          $tag = "windows-$env:BUILD_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag dist/yapfast-windows-x64.exe dist/SHA256SUMS `
            --target $env:BUILD_SHA `
            --title "Yapfast Windows dev build $($env:BUILD_SHA.Substring(0, 8))" `
            --notes-file release-notes.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "### Windows release: $tag" >> $env:GITHUB_STEP_SUMMARY
          $changes | Select-Object -First 15 |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Retain three recent Windows binaries and prune legacy Actions artifacts
        continue-on-error: true
        shell: pwsh
        env:
          CURRENT_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases for cleanup' }
          $windowsTags = @($tags | Where-Object { $_ -match '^windows-[0-9a-f]{40}-\d+-\d+$' })
          $retained = @($windowsTags | Select-Object -First 3)
          if ($env:CURRENT_TAG -and $env:CURRENT_TAG -notin $retained) {
            $retained += $env:CURRENT_TAG
          }

          foreach ($tag in $windowsTags) {
            if ($tag -in $retained) { continue }
            $assets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { continue }
            foreach ($name in @('yapfast-windows-x64.exe', 'SHA256SUMS')) {
              if ($name -notin $assets) { continue }
              gh release delete-asset $tag $name --yes
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not prune $name from $tag"
              }
            }
          }

          $ids = @(gh api --paginate `
            "repos/$env:YAPFAST_REPOSITORY/actions/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.name == "yapfast-windows-x64") | .id')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list legacy artifacts' }
          foreach ($id in $ids) {
            gh api -X DELETE "repos/$env:YAPFAST_REPOSITORY/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { Write-Warning "Could not delete artifact $id" }
          }

      - name: Notify Discord of build result
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { exit 0 }
          $success = '${{ job.status }}' -eq 'success'
          $status = if ($success) { 'SUCCESS' } else { 'FAILED' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($success -and $env:RELEASE_TAG) {
            $url = "https://github.com/$env:YAPFAST_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          }
          $message = "Yapfast Windows build **$status** for ``$($env:BUILD_SHA.Substring(0, 8))``: $url"
          $body = @{ content = $message } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
              -ContentType 'application/json' -Body $body -TimeoutSec 10 | Out-Null
          } catch {
            Write-Warning 'Discord notification failed.'
          }
) {
              $referenceSeconds = [int]$Matches[1]
              $referenceLabel = "previous Windows release ($previous)"
            }
          }
          $savedSeconds = $referenceSeconds - $cargoSeconds
          $savedPercent = [math]::Round(100 * $savedSeconds / $referenceSeconds, 1)
          $rustVersion = (rustc --version | Out-String).Trim()
          $binaryHash = (Get-FileHash dist/yapfast-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $diagnostics = @(
            '', '## Build diagnostics', '',
            "- Cargo compilation: $cargoSeconds s",
            "- Comparison: $referenceSeconds s ($referenceLabel)",
            "- Time saved: $savedSeconds s ($savedPercent percent)",
            "- Skia cache hit: ${{ steps.skia_cache.outputs.cache-hit }}",
            "- Cargo cache hit: ${{ steps.cargo_cache.outputs.cache-hit }}",
            "- LLVM cache hit: ${{ steps.llvm_cache.outputs.cache-hit }}",
            "- Rust compiler: $rustVersion",
            "- Executable SHA256: $binaryHash"
          )
          $notes += $diagnostics
          $notes | Set-Content release-notes.md -Encoding utf8

          $tag = "windows-$env:BUILD_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag dist/yapfast-windows-x64.exe dist/SHA256SUMS `
            --target $env:BUILD_SHA `
            --title "Yapfast Windows dev build $($env:BUILD_SHA.Substring(0, 8))" `
            --notes-file release-notes.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "### Windows release: $tag" >> $env:GITHUB_STEP_SUMMARY
          $changes | Select-Object -First 15 |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Retain three recent Windows binaries and prune legacy Actions artifacts
        continue-on-error: true
        shell: pwsh
        env:
          CURRENT_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases for cleanup' }
          $windowsTags = @($tags | Where-Object { $_ -match '^windows-[0-9a-f]{40}-\d+-\d+$' })
          $retained = @($windowsTags | Select-Object -First 3)
          if ($env:CURRENT_TAG -and $env:CURRENT_TAG -notin $retained) {
            $retained += $env:CURRENT_TAG
          }

          foreach ($tag in $windowsTags) {
            if ($tag -in $retained) { continue }
            $assets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { continue }
            foreach ($name in @('yapfast-windows-x64.exe', 'SHA256SUMS')) {
              if ($name -notin $assets) { continue }
              gh release delete-asset $tag $name --yes
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not prune $name from $tag"
              }
            }
          }

          $ids = @(gh api --paginate `
            "repos/$env:YAPFAST_REPOSITORY/actions/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.name == "yapfast-windows-x64") | .id')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list legacy artifacts' }
          foreach ($id in $ids) {
            gh api -X DELETE "repos/$env:YAPFAST_REPOSITORY/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { Write-Warning "Could not delete artifact $id" }
          }

      - name: Notify Discord of build result
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { exit 0 }
          $success = '${{ job.status }}' -eq 'success'
          $status = if ($success) { 'SUCCESS' } else { 'FAILED' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($success -and $env:RELEASE_TAG) {
            $url = "https://github.com/$env:YAPFAST_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          }
          $message = "Yapfast Windows build **$status** for ``$($env:BUILD_SHA.Substring(0, 8))``: $url"
          $body = @{ content = $message } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
              -ContentType 'application/json' -Body $body -TimeoutSec 10 | Out-Null
          } catch {
            Write-Warning 'Discord notification failed.'
          }
