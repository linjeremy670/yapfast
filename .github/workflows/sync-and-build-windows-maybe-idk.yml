name: Sync Upstream & Build Windows

on:
  workflow_call:
    inputs:
      force_build:
        type: boolean
        default: false
      enable_sccache:
        type: boolean
        default: false
    secrets:
      YAPFAST_TOKEN:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if the current commit was already released
        type: boolean
        default: false
      enable_sccache:
        description: Experimental compiler cache benchmark (use with force_build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yapfast-sync-windows
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: linjeremy670/yapfast
      YAPFAST_REPOSITORY: linjeremy670/yapfast
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          repository: linjeremy670/yapfast
          ref: automation/windows-build
          token: ${{ secrets.YAPFAST_TOKEN }}
          fetch-depth: 0

      - name: Fast-forward fork main to exact upstream commit
        shell: pwsh
        env:
          YAPFAST_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$env:YAPFAST_TOKEN@github.com/$env:YAPFAST_REPOSITORY.git"
          git remote add upstream https://github.com/yapfast/yapfast.git
          git fetch upstream main
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed' }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch fork main' }
            $upstreamSha = (git rev-parse upstream/main).Trim()
            $forkSha = (git rev-parse origin/main).Trim()

            if ($upstreamSha -eq $forkSha) {
              Write-Host "Fork main is already identical to upstream: $upstreamSha"
              break
            }
            git merge-base --is-ancestor origin/main upstream/main
            if ($LASTEXITCODE -ne 0) {
              throw 'Fork main diverged from upstream; refusing to rewrite history'
            }
            git push origin upstream/main:refs/heads/main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Fast-forwarded fork main $forkSha -> $upstreamSha"
              break
            }
            if ($attempt -eq 3) { throw 'Could not fast-forward fork main after three attempts' }
            Write-Warning "Push raced; retrying ($attempt/3)."
          }

      - name: Check for a successful build of this commit
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          $sha = (git rev-parse upstream/main).Trim()
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read GitHub releases' }

          $matching = @($tags | Where-Object { $_ -match "^windows-$sha-\d+-\d+$" })
          $released = $false
          foreach ($tag in $matching) {
            $assets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $tag" }
            if ('yapfast-windows-x64.exe' -in $assets -and 'SHA256SUMS' -in $assets) {
              $released = $true
              break
            }
          }

          $build = (-not $released) -or ($env:FORCE_BUILD -eq 'true')
          "should_build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Commit: $sha; Released: $released; Build: $build"

  build:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YAPFAST_REPOSITORY: linjeremy670/yapfast
      BUILD_SHA: ${{ needs.sync.outputs.sha }}

    steps:
      - name: Recheck for a complete release after the build queue
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases="$(gh api --paginate "repos/$YAPFAST_REPOSITORY/releases?per_page=100")"
          if jq -e --arg sha "$BUILD_SHA" '
            any(.[]; (.tag_name | test("^windows-" + $sha + "-[0-9]+-[0-9]+$"))
              and ([.assets[].name] | index("yapfast-windows-x64.exe") != null)
              and ([.assets[].name] | index("SHA256SUMS") != null))
          ' <<< "$releases" >/dev/null; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact synced commit
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/checkout@v5
        with:
          repository: linjeremy670/yapfast
          persist-credentials: false
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Install Nix
        if: steps.gate.outputs.should_build == 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Cache cargo-xwin Windows SDK
        if: steps.gate.outputs.should_build == 'true'
        id: xwin_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-v1-${{ hashFiles('nix/flake.lock') }}

      - name: Restore Cargo build cache
        if: steps.gate.outputs.should_build == 'true'
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-nix-release
          cache-on-failure: true
          cache-bin: false
          cache-targets: ${{ !inputs.enable_sccache }}

      - name: Set up optional sccache compiler cache
        if: steps.gate.outputs.should_build == 'true' && inputs.enable_sccache
        id: sccache_setup
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Build and package portable Windows release
        if: steps.gate.outputs.should_build == 'true'
        id: cargo_build
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ inputs.enable_sccache && steps.sccache_setup.outcome == 'success' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          set -euo pipefail
          nix develop 'path:./nix#windows' --command scripts/build-windows discord --no-installer
          echo "seconds=unknown" >> "$GITHUB_OUTPUT"

      - name: Report sccache efficiency
        if: always() && steps.gate.outputs.should_build == 'true' && steps.sccache_setup.outcome == 'success'
        shell: bash
        run: |
          if ! sccache --show-stats > sccache-stats.txt; then
            echo "::warning::sccache statistics unavailable"
            exit 0
          fi
          cat sccache-stats.txt
          {
            echo "### sccache statistics"
            echo '~~~'
            cat sccache-stats.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract and verify release assets
        if: steps.gate.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_zip="$(find target/dist/discord -maxdepth 1 -type f -name 'Yapfast-*-windows-x64.zip' -print -quit)"
          source_zip="$(find target/dist/discord -maxdepth 1 -type f -name 'Yapfast-*-source.zip' -print -quit)"
          test -n "$package_zip" && test -n "$source_zip"
          mkdir -p dist/portable
          unzip -q "$package_zip" -d dist/portable
          exe_entry="$(unzip -Z1 "$package_zip" | awk '/\/yapfast\.exe$/ { print; exit }')"
          test -n "$exe_entry"
          unzip -p "$package_zip" "$exe_entry" > dist/yapfast-windows-x64.exe
          test -s dist/yapfast-windows-x64.exe
          cp "$package_zip" "$source_zip" dist/
          (
            cd dist
            sha256sum yapfast-windows-x64.exe "$(basename "$package_zip")" "$(basename "$source_zip")" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "### Verified Windows executable and portable package checksums" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.gate.outputs.should_build == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
        run: |
          set -euo pipefail
          previous="$(gh api --paginate "repos/$YAPFAST_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^windows-[0-9a-f]{40}-[0-9]+-[0-9]+$")) | select((([.assets[].name] | index("yapfast-windows-x64.exe")) != null) and (([.assets[].name] | index("SHA256SUMS")) != null)) | .tag_name' | head -n 1 || true)"
          git fetch origin --tags
          if [[ -n "$previous" ]]; then
            git log -n 30 --format='- %h %s' "$previous..HEAD" > changes.txt || true
          else
            git log -n 30 --format='- %h %s' > changes.txt
          fi
          if [[ ! -s changes.txt ]]; then echo "- Rebuilt the same commit." > changes.txt; fi

          binary_hash="$(sha256sum dist/yapfast-windows-x64.exe | cut -d ' ' -f 1)"
          rust_version="$(nix develop 'path:./nix#windows' --command rustc --version)"
          short_sha="$(printf '%s' "$BUILD_SHA" | cut -c1-8)"
          {
            echo "Windows x64 portable build for upstream commit $BUILD_SHA."
            echo
            echo "## Changes since previous successful build"
            echo
            cat changes.txt
            echo
            echo "## Build diagnostics"
            echo
            echo "- Cargo cache exact-key hit: ${{ steps.cargo_cache.outputs.cache-hit }}"
            echo "- cargo-xwin Windows SDK cache hit: ${{ steps.xwin_cache.outputs.cache-hit }}"
            echo "- Optional sccache enabled: ${{ inputs.enable_sccache }}"
            echo "- LLVM and prepared-Skia caches: not used by upstream's current Nix cross-build"
            echo "- Rust compiler: $rust_version"
            echo "- Executable SHA256: $binary_hash"
          } > release-notes.md

          tag="windows-$BUILD_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" \
            dist/yapfast-windows-x64.exe \
            dist/SHA256SUMS \
            dist/Yapfast-*-windows-x64.zip \
            dist/Yapfast-*-source.zip \
            --target "$BUILD_SHA" \
            --title "Yapfast Windows build $short_sha" \
            --notes-file release-notes.md \
            --prerelease
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq 'yapfast-windows-x64.exe' <<< "$assets"
          grep -Fxq 'SHA256SUMS' <<< "$assets"
          grep -Eq '^Yapfast-.*-windows-x64\.zip$' <<< "$assets"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Windows release: https://github.com/$YAPFAST_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain three recent complete Windows releases
        if: steps.gate.outputs.should_build == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
          CURRENT_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(
            gh api --paginate "repos/$YAPFAST_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name | test("^windows-[0-9a-f]{40}-[0-9]+-[0-9]+$")) | select((([.assets[].name] | index("yapfast-windows-x64.exe")) != null) and (([.assets[].name] | index("SHA256SUMS")) != null)) | [.published_at, .tag_name] | @tsv' |
              sort -r
          )
          retained=()
          for row in "${{ releases[@]:0:3 }"; do
            retained+=("${row#*$'\t'}")
          done
          if [[ -n "$CURRENT_TAG" ]] && [[ ! " ${retained[*]} " =~ " $CURRENT_TAG " ]]; then
            retained=("$CURRENT_TAG" "${retained[@]:0:2}")
          fi
          for row in "${releases[@]}"; do
            tag="${row#*$'\t'}"
            [[ " ${retained[*]} " == *" $tag "* ]] && continue
            while IFS= read -r asset; do
              case "$asset" in
                yapfast-windows-x64.exe|SHA256SUMS|Yapfast-*-windows-x64.zip|Yapfast-*-source.zip)
                  gh release delete-asset "$tag" "$asset" --yes || echo "::warning::Could not prune $asset from $tag"
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          done

          ids="$(gh api --paginate "repos/$YAPFAST_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "yapfast-windows-x64") | .id')"
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api -X DELETE "repos/$YAPFAST_REPOSITORY/actions/artifacts/$artifact_id" || \
              echo "::warning::Could not delete legacy artifact $artifact_id"
          done <<< "$ids"

      - name: Notify Discord of build result
        if: always() && (steps.gate.outputs.should_build == 'true' || failure())
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook is not configured; notification skipped."
            exit 0
          fi
          status='${{ job.status }'
          status_label="$(printf '%s' "$status" | tr '[:lower:]' '[:upper:]')"
          short_sha="$(printf '%s' "$BUILD_SHA" | cut -c1-8)"
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$status" == "success" && -n "$RELEASE_TAG" ]]; then
            url="https://github.com/$YAPFAST_REPOSITORY/releases/tag/$RELEASE_TAG"
          fi
          cargo_hit='${{ steps.cargo_cache.outputs.cache-hit }'
          xwin_hit='${{ steps.xwin_cache.outputs.cache-hit }'
          message="Yapfast Windows build **$status_label** for $short_sha: $url | Cargo cache: $cargo_hit | cargo-xwin cache: $xwin_hit"
          payload="$(jq -n --arg content "$message" '{content:$content,allowed_mentions:{parse:[]}}')"
          curl --fail --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL" >/dev/null
